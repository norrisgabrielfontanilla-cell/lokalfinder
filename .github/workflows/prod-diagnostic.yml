name: Production restore + read-only check

# Throwaway: runs only on this branch. Never merge to main.
#  1. prod-golive.js makes the 7 stores re-created on 2026-10-07 visible again
#     (they came back as hidden drafts). It touches only stores that are still
#     untouched drafts, sets live/open state, fills display fields only where
#     missing and appends missing Feed-post items. It removes nothing.
#     (prod-restore.js, the earlier step, found all 7 already re-created.)
#  2. prod-diagnostic.js then reads the result back (read-only).
on:
  push:
    branches: [claude/prod-diagnostic]

permissions:
  contents: read

concurrency:
  group: prod-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make the restored stores visible (untouched drafts only)
        working-directory: tests
        run: node prod-golive.js
      - name: Install headless browser
        working-directory: tests
        run: npm install && npx playwright install --with-deps chromium
      - name: Read-only check of the live database and app
        working-directory: tests
        run: node prod-diagnostic.js
