name: Production read-only diagnostic

# Throwaway: runs only on this branch, only reads. Never merge to main.
on:
  push:
    branches: [claude/prod-diagnostic]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install headless browser
        working-directory: tests
        run: npm install && npx playwright install --with-deps chromium
      - name: Read-only check of the live database and app
        working-directory: tests
        run: node prod-diagnostic.js
