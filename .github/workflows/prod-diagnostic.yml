name: Production restore + read-only check

# Throwaway: runs only on this branch. Never merge to main.
#  1. prod-restore.js re-creates the stores erased on 2026-10-07. It only ever
#     ADDS a store that is missing and was not deleted on purpose, and only
#     adds a menu where none exists. It overwrites nothing.
#  2. prod-diagnostic.js then reads the result back (read-only).
on:
  push:
    branches: [claude/prod-diagnostic]

permissions:
  contents: read

concurrency:
  group: prod-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore erased stores (adds missing stores only)
        working-directory: tests
        run: node prod-restore.js
      - name: Install headless browser
        working-directory: tests
        run: npm install && npx playwright install --with-deps chromium
      - name: Read-only check of the live database and app
        working-directory: tests
        run: node prod-diagnostic.js
